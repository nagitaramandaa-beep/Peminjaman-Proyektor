<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Peminjaman Proyektor</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh; display: flex; justify-content: center;
    align-items: center; padding: 20px; margin: 0;
  }
  .card {
    background: #fff; padding: 30px; border-radius: 15px;
    width: 100%; max-width: 450px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  }
  h2 { text-align: center; color: #333; margin-top: 0; }
  p.sub { text-align: center; color: #888; font-size: 13px; margin-top: -8px; margin-bottom: 20px; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; color: #444; font-size: 14px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; outline: none; transition: .2s;
  }
  input:focus, select:focus, textarea:focus { border-color: #667eea; }
  button {
    width: 100%; margin-top: 20px; padding: 12px;
    background: #667eea; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: .2s;
  }
  button:hover { background: #556cd6; }
</style>
</head>
<body>

<div class="card">
  <h2>📽️ Peminjaman Proyektor</h2>
  <p class="sub">Data akan dikirim langsung ke admin</p>

  <form id="formPinjam">
    <label>Nama Peminjam</label>
    <input type="text" id="nama" required placeholder="Nama lengkap">

    <label>Kelas / Divisi</label>
    <input type="text" id="kelas" required placeholder="Contoh: XI RPL 1">

    <label>No. HP</label>
    <input type="tel" id="hp" required placeholder="08xxxxxxxxxx">

    <label>Tanggal Pinjam</label>
    <input type="date" id="tanggal" required>

    <label>Jam Mulai</label>
    <input type="time" id="jamMulai" required>

    <label>Jam Selesai</label>
    <input type="time" id="jamSelesai" required>

    <label>Keperluan</label>
    <textarea id="keperluan" rows="3" required placeholder="Contoh: Presentasi tugas akhir"></textarea>

    <button type="submit">Kirim Permohonan</button>
  </form>
</div>

<script>
  // ============================================
  // GANTI dengan nomor WhatsApp Anda
  // Format: 628xxxxxxxxxx (tanpa +, tanpa 0 di depan)
  // ============================================
  const NOMOR_ADMIN = "6285737024516"; // <-- GANTI INI

  document.getElementById('formPinjam').addEventListener('submit', function(e) {
    e.preventDefault();

    const nama      = document.getElementById('nama').value;
    const kelas     = document.getElementById('kelas').value;
    const hp        = document.getElementById('hp').value;
    const tanggal   = document.getElementById('tanggal').value;
    const jamMulai  = document.getElementById('jamMulai').value;
    const jamSelesai= document.getElementById('jamSelesai').value;
    const keperluan = document.getElementById('keperluan').value;

    const pesan =
`*📽️ PENGAJUAN PEMINJAMAN PROYEKTOR*

👤 Nama       : ${nama}
🏫 Kelas/Divisi: ${kelas}
📱 No. HP     : ${hp}
📅 Tanggal    : ${tanggal}
⏰ Jam        : ${jamMulai} - ${jamSelesai}
📝 Keperluan  : ${keperluan}

Mohon konfirmasi. Terima kasih 🙏`;

    const url = `https://wa.me/085737024516?text=${encodeURIComponent(pesan)}`;
    window.open(url, '_blank');

    this.reset();
  });
</script>

</body>
</html>
